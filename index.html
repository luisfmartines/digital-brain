<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#131318" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Digital Brain</title>
    <style>
      body { margin: 0; background: #131318; color: #ececf1; }
      #startup { display: none; min-height: 100vh; padding: 24px; box-sizing: border-box; place-content: center; text-align: center; font: 16px system-ui, sans-serif; }
      #root:empty + #startup { display: grid; }
      #startup [data-recovery], #startup[data-failed] [data-loading] { display: none; }
      #startup[data-failed] [data-recovery] { display: block; }
      #startup a { text-decoration: none; margin: 8px auto; padding: 10px 16px; border: 0; border-radius: 8px; background: #3fa672; color: #06281a; font: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup" role="status">
      <strong>Digital Brain</strong>
      <p data-loading>Carregando…</p>
      <p data-recovery>Não foi possível abrir o app. Confira a conexão e tente novamente.</p>
      <a data-recovery id="startup-retry" href="">Recarregar</a>
      <noscript>Ative o JavaScript para abrir o Digital Brain.</noscript>
    </div>
    <script>
      window.setTimeout(function () {
        if (!document.getElementById('root').firstElementChild) {
          document.getElementById('startup').setAttribute('data-failed', '')
        }
      }, 12000)
    </script>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
